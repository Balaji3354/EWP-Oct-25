<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Interactive Page – Enhanced</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(135deg, #0a5c63, #093d48);
      color: #ffffff;
      transition: background 0.5s ease, color 0.4s ease;
    }

    h1, h2 {
      animation: fadeIn 1s ease forwards;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 15px;
      margin: 1.5rem auto;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: popIn 0.7s ease forwards;
    }

    button {
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #992e7d, #d94ba4);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    /* Dark Mode */
    .dark {
      background: linear-gradient(135deg, #121212, #2a2a2a);
      color: #f5f5f5;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <h1 id="welcome">👋 Hello there! Welcome!</h1>
  <p id="greeting" style="font-size: 1.3rem; margin-bottom: 1.5rem;"></p>

  <button id="themeBtn">🌞 / 🌙 Toggle Dark Mode</button>

  <!-- Quote -->
  <div class="card">
    <h2>🌟 Quote of the Day</h2>
    <p id="quote" style="font-size: 1.1rem;"></p>
  </div>

  <!-- Click Counter -->
  <div class="card">
    <h2>🖱️ Click Counter</h2>
    <button id="countBtn">Click me!</button>
    <p style="margin-top: 10px;">Clicks: <span id="count">0</span></p>
  </div>

  <!-- Background Color Changer -->
  <div class="card">
    <h2>🎨 Background Color Changer</h2>
    <button id="colorBtn">Change Background Color</button>
  </div>

  <script>
    // Dark Mode Toggle
    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    // Ask for Visitor Name
    const userName = prompt("May I know your good name?");
    if (userName) {
      document.getElementById("welcome").textContent = `Welcome, ${userName}! 🎉`;
    }

    // Time Greeting
    const hour = new Date().getHours();
    document.getElementById("greeting").textContent =
      hour < 12 ? "🌄 Good Morning!" :
      hour < 18 ? "☕😎 Good Afternoon!" :
                  "🌇 Good Evening!";

    // Quote of the Day
    const quotes = [
      "Believe you can and you're halfway there.",
      "Do something today that your future self will thank you for.",
      "Great things never come from comfort zones.",
      "Happiness is not by chance, but by choice.",
      "Dream big, work hard, stay focused."
    ];
    document.getElementById("quote").textContent =
      quotes[Math.floor(Math.random() * quotes.length)];

    // Function to generate a random color
    function randomColor() {
      return "#" + Math.floor(Math.random() * 16777215)
        .toString(16).padStart(6, "0");
    }

    // Click Counter + Background Change
    let count = 0;
    document.getElementById("countBtn").addEventListener("click", () => {
      document.getElementById("count").textContent = ++count;

      // Change the background color on every click
      document.body.style.background = randomColor();
    });

    // Background Color Changer Button
    document.getElementById("colorBtn").addEventListener("click", () => {
      document.body.style.background = randomColor();
    });

  </script>

</body>
</html>
